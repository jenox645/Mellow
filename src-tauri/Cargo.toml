[package]
name = "mellowdlp-shell"
version = "2.14.2"
description = "MellowDLP desktop shell (Tauri trial): a window around the Flask backend"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tauri's recommended size settings
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
