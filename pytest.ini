[pytest]
markers =
    e2e: end-to-end tests requiring real network and yt-dlp
    slow: slow tests (100+ item playlists, manual runs only)
    browser: tests against a local media server with real yt-dlp + ffmpeg: UI smoke tests in Chromium, vault syncs (tests/browser, CI job "browser")
testpaths = tests
addopts = -v
