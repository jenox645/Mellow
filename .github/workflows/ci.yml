name: MellowDLP CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # e2e/slow tests download from real sites and are run by hand
      - name: Run tests
        run: python -m pytest tests/ -m "not e2e and not slow" --timeout=60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint
        run: npx --yes eslint@9 "gui/**/*.jsx" "gui/**/*.js"
      - name: Bundle
        run: >
          npx --yes esbuild gui/app.jsx --bundle --outfile=app.bundle.js
          --loader:.jsx=jsx --target=es2020 --platform=browser --format=iife
          --global-name=MellowApp --jsx=transform
          --jsx-factory=React.createElement --jsx-fragment=React.Fragment

  build-linux:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: sudo apt-get install -y ffmpeg wget python3-tk

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller pillow

      - name: Download yt-dlp
        run: |
          wget -q "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -O yt-dlp
          chmod +x yt-dlp

      - name: Build
        run: python3 build_setup.py

      - name: Upload ELF binary
        uses: actions/upload-artifact@v4
        with:
          name: MellowDLP-linux-x86_64
          path: dist/MellowDLP
          retention-days: 7
          if-no-files-found: error

      - name: Upload AppImage (if built)
        uses: actions/upload-artifact@v4
        with:
          name: MellowDLP-linux-AppImage
          path: dist/MellowDLP-*.AppImage
          retention-days: 7
          if-no-files-found: ignore
