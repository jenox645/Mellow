name: MellowDLP CI

# Branch pushes are covered by their pull request; only main runs on push
# (no double runs for a PR branch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run in progress; runs on main all finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # e2e/slow tests download from real sites and are run by hand
      - name: Run tests
        run: python -m pytest tests/ -m "not e2e and not slow and not browser" --timeout=60

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install (package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Bundle
        run: npm run bundle

  build-linux:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install system deps
        run: sudo apt-get install -y ffmpeg wget python3-tk

      # build_setup.py installs the Python and npm dependencies itself
      - name: Build
        run: python3 build_setup.py

      - name: Smoke-test the binary
        run: python3 scripts/smoke_binary.py dist/MellowDLP

      - name: Upload ELF binary
        uses: actions/upload-artifact@v7
        with:
          name: MellowDLP-linux-x86_64
          path: dist/MellowDLP
          retention-days: 7
          if-no-files-found: error

      - name: Upload AppImage (if built)
        uses: actions/upload-artifact@v7
        with:
          name: MellowDLP-linux-AppImage
          path: dist/MellowDLP-*.AppImage
          retention-days: 7
          if-no-files-found: ignore
