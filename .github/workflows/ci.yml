name: MellowDLP CI

# Branch pushes are covered by their pull request; only main runs on push
# (no double runs for a PR branch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run in progress; runs on main all finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, unit tests (Windows/Linux/macOS), frontend and browser tests, all on
  # this run's commit (the same workflow release.yml runs before publishing)
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      sha: ${{ github.sha }}

  build-linux:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install system deps
        run: sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg wget python3-tk   # see validate.yml

      # build_setup.py installs the Python and npm dependencies itself
      - name: Build
        run: python3 build_setup.py

      - name: Smoke-test the binary
        run: python3 scripts/smoke_binary.py dist/MellowDLP

      - name: Upload ELF binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MellowDLP-linux-x86_64
          path: dist/MellowDLP
          retention-days: 7
          if-no-files-found: error

      - name: Upload AppImage (if built)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MellowDLP-linux-AppImage
          path: dist/MellowDLP-*.AppImage
          retention-days: 7
          if-no-files-found: ignore
