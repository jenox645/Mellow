name: Release

# Push a tag matching mellow/version.py to publish a release:
#   git tag v2.1.0 && git push origin v2.1.0
# Builds the Windows installer and the Linux binary + AppImage, starts each
# build with scripts/smoke_binary.py, and only then publishes the GitHub
# release (with SHA256SUMS.txt). A tag with a suffix (v2.1.0-rc1) becomes a
# pre-release. The in-app "update available" check reads this release.
#
# A pull request that touches the packaging runs the builds too, so a broken
# installer shows up before the tag; it never publishes. It also checks the
# in-app update for real: a copy built as 0.0.1, installed by its installer,
# updates itself to the latest published release (update-windows).
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build_setup.py
      - MellowDLP.spec
      - installer.iss
      - requirements*.txt
      - package-lock.json
      - main.py
      - mellow/app_update.py
      - scripts/smoke_binary.py
      - scripts/update_e2e.py
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Read APP_VERSION (and match it against the tag)
        shell: bash
        run: |
          version=$(python3 -c "from mellow.version import APP_VERSION; print(APP_VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "${tag%%-*}" != "v$version" ]]; then
              echo "::error::Tag $tag doesn't match APP_VERSION $version in mellow/version.py"
              exit 1
            fi
          fi
          echo "APP_VERSION $version"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        run: python build_setup.py
      - name: Smoke-test the exe
        run: python scripts/smoke_binary.py dist/MellowDLP.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/MellowDLP_Setup.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: version
    runs-on: ubuntu-22.04   # the oldest glibc we build on is the oldest one the binary runs on
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Build
        run: python3 build_setup.py
      - name: Smoke-test the binary and the AppImage
        run: |
          python3 scripts/smoke_binary.py dist/MellowDLP
          APPIMAGE_EXTRACT_AND_RUN=1 python3 scripts/smoke_binary.py dist/MellowDLP-*-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/MellowDLP
            dist/MellowDLP-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  # Install a 0.0.1 build with its installer, then let it update itself to
  # the latest published release through the API, the way a user's copy would
  update-windows:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build as version 0.0.1
        shell: pwsh
        run: |
          (Get-Content mellow/version.py) -replace 'APP_VERSION = ".*"', 'APP_VERSION = "0.0.1"' | Set-Content mellow/version.py
          python build_setup.py
      - name: Install it
        shell: pwsh
        run: Start-Process dist\MellowDLP_Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
      - name: Update it from the latest release
        run: .venv\Scripts\python scripts/update_e2e.py "$env:LOCALAPPDATA\Programs\MellowDLP\MellowDLP.exe" windows-installer

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Name the files and write checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir release
          cp artifacts/windows/MellowDLP_Setup.exe "release/MellowDLP-$VERSION-windows-setup.exe"
          cp artifacts/linux/MellowDLP "release/MellowDLP-$VERSION-linux-x86_64"
          cp artifacts/linux/MellowDLP-*-x86_64.AppImage "release/MellowDLP-$VERSION-x86_64.AppImage"
          chmod +x release/MellowDLP-*-linux-x86_64 release/*.AppImage
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --title "MellowDLP $VERSION" --generate-notes $prerelease
