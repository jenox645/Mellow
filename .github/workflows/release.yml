name: Release

# Publishing a release:
# - merge a change of APP_VERSION (mellow/version.py) into main: the release
#   vX.Y.Z is built and published by itself, tag included. Installed copies
#   then offer UPDATE & RESTART; nobody needs git or a local build;
# - or push a tag matching APP_VERSION on a commit that is already on main
#   (a -suffix tag, v2.1.0-rc1, makes a pre-release). A tag off main, a tag
#   that doesn't match APP_VERSION and a tag whose release exists are refused.
# Never a version at or below the highest stable release, checked when the run
# starts and again right before publishing (scripts/release_gate.py).
# Every run first tests the exact commit it would release with the full suite
# (validate.yml, the same one CI runs); only when that passes does it build the
# Windows installer and the Linux binary + AppImage, start each build with
# scripts/smoke_binary.py, and then publish the GitHub release (with
# SHA256SUMS.txt and a signed build provenance for each file). The in-app
# "update available" check reads this release.
#
# A pull request that touches the packaging runs the builds too, so a broken
# installer shows up before the tag; it never publishes. It also checks the
# in-app update for real: a copy built as 0.0.1, installed by its installer,
# updates itself to the latest published release (update-windows), and a
# portable exe swaps itself for a served build (update-windows-portable).
on:
  push:
    tags: ['v*']
    # Tag pushes ignore the path filter; main runs only when the version changed
    branches: [main]
    paths: [mellow/version.py]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build_setup.py
      - packaging/**
      - requirements*.txt
      - package-lock.json
      - main.py
      - mellow/app_update.py
      - CHANGELOG.md
      - mellow/fetch.py
      - mellow/ffmpeg_install.py
      - scripts/ffmpeg_e2e.py
      - scripts/smoke_binary.py
      - scripts/update_e2e.py
      - scripts/release_gate.py
  workflow_dispatch:

# Every run that may publish (pushes to main and tags) shares one queue, so two
# of them never decide "not released yet" at the same time
concurrency:
  group: ${{ github.event_name == 'push' && 'release-publish' || format('release-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      build: ${{ steps.v.outputs.build }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # main's history, to check a tagged commit is on it
          persist-credentials: false
      - id: v
        name: Read APP_VERSION and decide what this run does
        env:
          GH_TOKEN: ${{ github.token }}
        # The rules (and their tests, tests/test_release_gate.py) are in the script
        run: python3 scripts/release_gate.py decide

  # The full suite on the exact commit this run builds and would publish
  validate:
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      sha: ${{ needs.version.outputs.sha }}

  windows:
    needs: [version, validate]
    if: needs.version.outputs.build == 'true' && needs.validate.result == 'success' && needs.validate.outputs.sha == needs.version.outputs.sha
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}   # the validated commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        run: python build_setup.py
      - name: Smoke-test the portable exe and the installed build
        run: |
          python scripts/smoke_binary.py dist/MellowDLP.exe
          python scripts/smoke_binary.py dist/MellowDLP-app/MellowDLP.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            dist/MellowDLP_Setup.exe
            dist/MellowDLP.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: [version, validate]
    if: needs.version.outputs.build == 'true' && needs.validate.result == 'success' && needs.validate.outputs.sha == needs.version.outputs.sha
    runs-on: ubuntu-22.04   # the oldest glibc we build on is the oldest one the binary runs on
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}   # the validated commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Build
        run: python3 build_setup.py
      - name: Smoke-test the binary and the AppImage
        run: |
          python3 scripts/smoke_binary.py dist/MellowDLP
          APPIMAGE_EXTRACT_AND_RUN=1 python3 scripts/smoke_binary.py dist/MellowDLP-*-x86_64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/MellowDLP
            dist/MellowDLP-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  # Install a 0.0.1 build with its installer, then let it update itself to
  # the latest published release through the API, the way a user's copy would
  update-windows:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build as version 0.0.1
        shell: pwsh
        run: |
          (Get-Content mellow/version.py) -replace 'APP_VERSION = ".*"', 'APP_VERSION = "0.0.1"' | Set-Content mellow/version.py
          python build_setup.py
      - name: Install it
        shell: pwsh
        run: Start-Process dist\MellowDLP_Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
      - name: Update it from the latest release
        run: .venv\Scripts\python scripts/update_e2e.py "$env:LOCALAPPDATA\Programs\MellowDLP\MellowDLP.exe" windows-installer

  # A portable exe (SETUP.bat's "App only" build) updating itself: the
  # same build as 9.9.9 is served as the release, a 0.0.1 copy takes it
  update-windows-portable:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Build 9.9.9 as the release to update to
        shell: pwsh
        run: |
          (Get-Content mellow/version.py) -replace 'APP_VERSION = ".*"', 'APP_VERSION = "9.9.9"' | Set-Content mellow/version.py
          python build_setup.py --desktop-shortcut
          New-Item -ItemType Directory feed | Out-Null
          Copy-Item dist\MellowDLP.exe feed\MellowDLP-9.9.9-windows-portable.exe
          $hash = (Get-FileHash feed\MellowDLP-9.9.9-windows-portable.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path feed\SHA256SUMS.txt -Value "$hash  MellowDLP-9.9.9-windows-portable.exe" -NoNewline
      - name: Build 0.0.1 as the portable copy
        shell: pwsh
        run: |
          (Get-Content mellow/version.py) -replace 'APP_VERSION = ".*"', 'APP_VERSION = "0.0.1"' | Set-Content mellow/version.py
          python build_setup.py --desktop-shortcut
          New-Item -ItemType Directory app | Out-Null
          Copy-Item dist\MellowDLP.exe app\MellowDLP.exe
      - name: Update it from the served release
        run: .venv\Scripts\python scripts/update_e2e.py app\MellowDLP.exe windows-portable --feed feed 9.9.9

  # GET FFMPEG for real: download the current build for each system, check
  # it, install it into a temp folder and convert audio with it
  ffmpeg-install:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python scripts/ffmpeg_e2e.py

  # Only after the suite, both builds and their smoke tests passed for this commit
  publish:
    if: >-
      needs.version.outputs.publish == 'true'
      && needs.validate.result == 'success'
      && needs.validate.outputs.sha == needs.version.outputs.sha
      && needs.windows.result == 'success'
      && needs.linux.result == 'success'
    needs: [version, validate, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # the Sigstore certificate that signs the provenance
      attestations: write   # where GitHub keeps it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Released commit is the tested one
        env:
          EXPECTED: ${{ needs.version.outputs.sha }}
        run: '[[ "$(git rev-parse HEAD)" == "$EXPECTED" && "$GITHUB_SHA" == "$EXPECTED" ]] || { echo "::error::commit changed during the run"; exit 1; }'
      # Only the two builds of this run, by name
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: artifacts/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: artifacts/linux
      - name: Name the files and write checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir release
          cp artifacts/windows/MellowDLP_Setup.exe "release/MellowDLP-$VERSION-windows-setup.exe"
          cp artifacts/windows/MellowDLP.exe "release/MellowDLP-$VERSION-windows-portable.exe"
          cp artifacts/linux/MellowDLP "release/MellowDLP-$VERSION-linux-x86_64"
          cp artifacts/linux/MellowDLP-*-x86_64.AppImage "release/MellowDLP-$VERSION-x86_64.AppImage"
          chmod +x release/MellowDLP-*-linux-x86_64 release/*.AppImage
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # Signed build provenance for every file: anyone can check it was built
      # by this workflow from this repository's commit, not made or swapped by
      # hand (gh attestation verify <file> --repo <owner>/<repo>). Before the
      # release exists, so no release goes out without it.
      - name: Sign the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The CHANGELOG.md section, which file to download, then GitHub's list of merged PRs
          {
            python3 -c "from mellow import changelog; print(changelog.section('$VERSION'))"
            echo
            sed -e "s|{version}|$VERSION|g" -e "s|{tag}|$TAG|g" -e "s|{repo}|$GITHUB_REPOSITORY|g" \
              .github/release-download.md
          } > notes.md
          # Checks once more that the release doesn't exist and the tag is absent or on the
          # tested commit, then gh release create (--target: a release from main creates
          # its tag on the commit that was built)
          python3 scripts/release_gate.py publish --tag "$TAG" --sha "$GITHUB_SHA" \
            --title "MellowDLP $VERSION" --notes-file notes.md release/*
