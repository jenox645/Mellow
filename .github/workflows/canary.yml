name: yt-dlp canary
# Weekly check that the app's extraction paths still work against the
# latest (pre-release) yt-dlp — find out about extractor breakage before
# a user does. Does not block normal CI; a failure opens (or comments on)
# one "yt-dlp canary failing" issue so it isn't missed.
#
# scripts/canary.py separates "yt-dlp broke" (fails the run) from "the site
# refused this runner" (warning only): GitHub's datacenter IPs regularly hit
# bot checks and login walls that say nothing about the app.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install deps with yt-dlp pre-release
        run: |
          pip install -r requirements.txt
          pip install --upgrade --pre yt-dlp
      - name: Show yt-dlp version
        run: python -c "import yt_dlp; print(yt_dlp.version.__version__)"
      - name: Probe stable URLs through the app's downloader
        run: python scripts/canary.py
      - name: Report the failure as an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="yt-dlp canary failing"
          body="The weekly extraction probe failed against yt-dlp $(python -c 'import yt_dlp; print(yt_dlp.version.__version__)'): $RUN_URL"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Still failing. $body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
