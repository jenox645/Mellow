name: Validate

# The full test suite for one exact commit. Called by ci.yml (every pull request
# and push to main) and by release.yml (the commit about to be released), so a
# release is tested by its own run, never by looking for some other run's result.
on:
  workflow_call:
    inputs:
      sha:
        description: Full commit SHA to check out and test
        required: true
        type: string
    outputs:
      sha:
        description: The commit every job tested (set only when all of them passed)
        value: ${{ jobs.gate.outputs.sha }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Tested commit is the requested one
        shell: bash
        env:
          EXPECTED: ${{ inputs.sha }}
        run: |
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit SHA: $EXPECTED"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED" ]] || { echo "::error::checked out $(git rev-parse HEAD), expected $EXPECTED"; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # e2e/slow tests download from real sites and are run by hand
      - name: Run tests
        run: python -m pytest tests/ -m "not e2e and not slow and not browser" --timeout=60

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Tested commit is the requested one
        env:
          EXPECTED: ${{ inputs.sha }}
        run: '[[ "$(git rev-parse HEAD)" == "$EXPECTED" ]] || { echo "::error::wrong commit checked out"; exit 1; }'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install (package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Bundle
        run: npm run bundle

  # The main flows clicked through in Chromium: real downloads from a local
  # media site (tests/browser), so a broken page fails CI, not a user
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Tested commit is the requested one
        env:
          EXPECTED: ${{ inputs.sha }}
        run: '[[ "$(git rev-parse HEAD)" == "$EXPECTED" ]] || { echo "::error::wrong commit checked out"; exit 1; }'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        # Chromium without --with-deps: the runner image has Chrome, so it has the
        # libraries too, and --with-deps fetched fonts and Xvfb through the slow
        # Ubuntu mirror until the job timed out. They're installed only when the
        # browser doesn't start without them
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright as p; pw = p().start(); pw.chromium.launch().close(); pw.stop()" \
            || python -m playwright install-deps chromium
      # ffmpeg the way GET FFMPEG installs it (BtbN's build, from GitHub's CDN,
      # checked against its checksums), not apt's: Ubuntu's mirror served apt's
      # 64 MB of ffmpeg packages at 30 kB/s and ran jobs past their timeout
      - name: Install ffmpeg
        run: |
          python - <<'PY'
          import sys
          from mellow import ffmpeg_install
          events = []
          ffmpeg_install.install(events.append)
          print(events[-1])
          sys.exit(events[-1]["stage"] != "done")
          PY
          echo "$HOME/.mellow_dlp_ffmpeg" >> "$GITHUB_PATH"
      - name: Build the frontend
        run: python build_setup.py --frontend-only
      - name: Browser tests
        run: python -m pytest tests/browser -m browser --timeout=120

  # One result for callers: success only when every job above succeeded (not
  # skipped, cancelled or failed), and it names the commit they tested
  gate:
    needs: [test, frontend, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ok.outputs.sha }}
    steps:
      - id: ok
        env:
          RESULTS: ${{ needs.test.result }} ${{ needs.frontend.result }} ${{ needs.browser.result }}
          SHA: ${{ inputs.sha }}
        run: |
          for r in $RESULTS; do
            [[ "$r" == success ]] || { echo "::error::validation incomplete: $RESULTS"; exit 1; }
          done
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
