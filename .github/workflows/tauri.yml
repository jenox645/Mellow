name: Tauri app

# The Tauri app (src-tauri/, docs/TAURI_TRIAL.md): `cargo test`, then
# `build_setup.py --tauri` on Windows and Linux and a smoke test of the backend
# the bundle carries, run the way the shell runs it. Nothing is published: the
# bundles are this run's artifacts for a week. Pull requests that touch the app
# or its build only.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'build_setup.py'
      - 'main.py'
      - 'packaging/MellowDLP.spec'
      - 'scripts/smoke_binary.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        # 22.04: an AppImage runs on the glibc it was built with and newer
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # Tauri's (docs: prerequisites) plus GStreamer for the AppImage's media
      # framework (bundleMediaFramework copies what is installed here: no libav)
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file python3-tk \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-gl

      - name: Shell tests (cargo test)
        working-directory: src-tauri
        run: cargo test --locked

      # build_setup.py installs the Python and npm dependencies itself
      - name: Build
        env:
          # linuxdeploy (the AppImage step) is an AppImage itself: no FUSE on the runner
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: python build_setup.py --tauri

      - name: Smoke-test the bundled backend (as the shell starts it)
        shell: bash
        run: |
          exe=dist/MellowDLP-backend/mellowdlp-backend
          [[ "$RUNNER_OS" == Windows ]] && exe="$exe.exe"
          python scripts/smoke_binary.py --shell "$exe"

      - name: Upload the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MellowDLP-tauri-${{ runner.os }}
          path: dist/tauri/*
          retention-days: 7
          if-no-files-found: error
